[project]
name = "MaaPTN"
version = "0.1.0"
description = "Maa Path To Nowhere - 无期迷途自动化日常助手"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "AGPL-3.0"}

dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pure-python-adb>=0.3.0.dev0",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
maaptn = "main:main"

[tool.ruff]
line-length = 120
target-version = "py39"
